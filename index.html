<style>

    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{background:#0B0B0D;color:#F5F2EB;font-family:var(--lb);overflow-x:hidden;}

    :root{
  --pf:'Bebas Neue',sans-serif;

  --lb:'Manrope',sans-serif;
  --ink:#F5F2EB;
  --paper:#0B0B0D;
  --gold:#B87A45;
  --dark:#0B0B0D;
  --mid:#9A9A98;
  --lite:#9A9A98;
  --graphite:#27272C;
  --bronze:#B87A45;
  --indigo:#5957FF;
  --emerald:#416356;
  --sand:#D9C8AE;
}
    .fade{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease;}
    .fade.in{opacity:1;transform:none;}
    .s1{transition-delay:.06s!important;}.s2{transition-delay:.12s!important;}.s3{transition-delay:.18s!important;}

    .s7{transition-delay:.42s!important;}.s8{transition-delay:.48s!important;}

    #splash{position:fixed;inset:0;background:#0B0B0D;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease;}

    .splash-rule{width:0;height:2px;background:linear-gradient(to right,#B87A45,#B87A45,#416356);margin-top:18px;animation:aRule 1.1s ease .2s forwards;}

    .pwa-banner.show{transform:translateY(0);}
    .pwa-ibtn{font-family:var(--lb);font-size:10px;letter-spacing:3px;text-transform:uppercase;background:#B87A45;color:#111;border:none;padding:10px 20px;cursor:pointer;flex-shrink:0;font-weight:bold;}
    .pwa-dbtn{font-family:var(--lb);font-size:9px;background:none;border:none;color:rgba(244,240,230,.4);cursor:pointer;padding:8px;}
    .ph-img{background:linear-gradient(135deg,#1c1c1c 0%,#252525 50%,#1c1c1c 100%);position:relative;overflow:hidden;}

    .nbtn{font-family:var(--lb);font-size:10px;letter-spacing:3px;text-transform:uppercase;background:none;border:none;cursor:pointer;padding:5px 0;color:#555555;transition:opacity .15s;}
    .nbtn:hover{opacity:.6;}

    .card:hover .cimg{transform:scale(1.04);}
    .scrim{background:linear-gradient(to top,rgba(0,0,0,.93) 0%,rgba(0,0,0,.18) 60%,transparent 100%);position:absolute;inset:0;}
    .cl-row{display:flex;align-items:baseline;gap:12px;padding:7px 0;border-bottom:.5px solid rgba(244,240,230,.07);cursor:pointer;transition:gap .2s;}

    .cl-row:hover .cl-t{color:#fff;}
    .chip{font-family:var(--lb);font-size:9px;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border:1px solid rgba(244,240,230,.15);color:rgba(244,240,230,.45);display:inline-block;margin:3px 3px 3px 0;}
    .ph-txt{font-family:var(--lb);font-size:11px;color:#9A9A98;font-style:italic;background:rgba(0,0,0,.04);border:1px dashed #333338;padding:10px 14px;line-height:1.6;display:block;}
    .sbtn{font-family:var(--lb);font-size:9px;letter-spacing:2px;text-transform:uppercase;border:1px solid #333338;background:transparent;padding:6px 14px;cursor:pointer;color:#9A9A98;transition:all .2s;}
    .sbtn:hover{background:#111;color:var(--paper);}
    .pbr{height:100%;width:0%;transition:width .1s linear;}
    .cover-grid{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 28px);}
    .toc-mid{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:3px;}
    .toc-bot{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:32px;}
    .sec-idx{border-top:2px solid #111;padding-top:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:28px;}
    .more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
    .hs-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
    .btn-g{font-family:var(--lb);font-size:10px;letter-spacing:4px;text-transform:uppercase;background:var(--gold);color:#0B0B0D;border:none;padding:12px 28px;cursor:pointer;font-weight:bold;transition:background .2s;}
    .btn-g:hover{background:var(--paper);}
    .btn-d{font-family:var(--lb);font-size:10px;letter-spacing:4px;text-transform:uppercase;background:#111;color:var(--paper);border:none;padding:13px 34px;cursor:pointer;transition:background .2s;}
    .btn-d:hover{background:#9A9A98;}

    /* RADIO PLAYER — top right compact */
    #radio-player{position:fixed;top:12px;right:16px;background:rgba(0,0,0,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(212,168,83,.25);border-radius:32px;padding:7px 14px;display:flex;align-items:center;gap:10px;z-index:998;opacity:0;pointer-events:none;transform:translateY(-8px);transition:opacity .35s ease,transform .35s ease;max-width:280px;}
    #radio-player.show{opacity:1;pointer-events:auto;transform:translateY(0);}
    .radio-dot{width:7px;height:7px;border-radius:50%;background:#B87A45;animation:pulse 1.8s ease-in-out infinite;flex-shrink:0;}
    .radio-dot.paused{animation:none;background:rgba(212,168,83,.35);}

    .radio-info{flex:1;min-width:0;}
    .radio-label{font-family:var(--lb);font-size:7px;letter-spacing:3px;color:rgba(212,168,83,.7);text-transform:uppercase;margin-bottom:0;}

    .radio-playbtn{width:28px;height:28px;border-radius:50%;border:1px solid rgba(212,168,83,.4);background:transparent;color:#B87A45;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;transition:background .2s,color .2s;}
    .radio-playbtn:hover{background:#B87A45;color:#111;}
    .radio-closebtn{font-family:var(--lb);font-size:9px;color:rgba(244,240,230,.3);background:none;border:none;cursor:pointer;padding:4px 8px;flex-shrink:0;transition:color .2s;}
    .radio-closebtn:hover{color:rgba(244,240,230,.7);}
    .radio-trigger{position:fixed;bottom:80px;left:20px;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);border:1px solid rgba(212,168,83,.35);border-radius:20px;padding:7px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;z-index:996;transition:border-color .2s;}
    .radio-trigger:hover{border-color:#B87A45;}
    .radio-trigger-dot{width:6px;height:6px;border-radius:50%;background:#B87A45;animation:pulse 1.8s ease-in-out infinite;}
    .radio-trigger-txt{font-family:var(--lb);font-size:9px;letter-spacing:3px;color:rgba(244,240,230,.6);text-transform:uppercase;}

    /* MAGAZINE BOTTOM NAV */
    #mag-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(244,240,230,.97);backdrop-filter:blur(10px);border-top:1.5px solid #111;display:none;z-index:995;padding:0;}
    #mag-nav.show{display:flex;}
    .mag-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 12px;background:none;border:none;border-right:.5px solid rgba(0,0,0,.08);cursor:pointer;transition:background .15s;gap:4px;text-decoration:none;}
    .mag-nav-btn:last-child{border-right:none;}
    .mag-nav-btn:hover{background:rgba(0,0,0,.04);}
    .mag-nav-btn.active{background:rgba(0,0,0,.06);}
    .mag-nav-icon{font-size:16px;line-height:1;}
    .mag-nav-label{font-family:var(--lb);font-size:7px;letter-spacing:2px;text-transform:uppercase;color:#111;line-height:1;font-weight:500;}

  }

  .outer-nav{
    background:#0B0B0D;position:sticky;top:0;z-index:100;
    border-top:2px solid #F5F2EB;
    border-bottom:2px solid #F5F2EB;
  }
  .outer-nav::after{
    content:'scroll ›';

    background:linear-gradient(to right,transparent,#111 40%);

    align-items:center;justify-content:flex-end;
    padding-right:10px;
    font-family:var(--lb);font-size:8px;letter-spacing:1px;
    color:rgba(212,168,83,.6);
    pointer-events:none;
    transition:opacity .4s;
  }
  @media(max-width:768px){
    .outer-nav::after{display:flex;}
    .outer-nav.scrolled::after{opacity:0;}
  }
  .outer-nav-fade{
    display:none;position:absolute;right:0;top:0;bottom:0;
    width:60px;pointer-events:none;z-index:5;
    background:linear-gradient(to right,transparent,#111);
  }
  @media(max-width:768px){.outer-nav-fade{display:block;}}
  .outer-nav-inner{
    max-width:100%;display:flex;align-items:stretch;justify-content:center;
  }

    transition:color .15s,background .15s;white-space:nowrap;
  }
  .outer-nav-item:hover,.outer-nav-item.active{color:#B87A45;}

  .outer-nav-radio{
    display:flex;align-items:center;gap:10px;
    padding:0 20px;border-left:1px solid #111115;cursor:pointer;
    transition:background .15s;
  }
  .outer-nav-radio:hover{background:rgba(255,255,255,.04);}
  .outer-nav-radio-dot{
    width:7px;height:7px;border-radius:50%;background:#B87A45;
    animation:pulse 1.8s ease-in-out infinite;flex-shrink:0;
  }
  .outer-nav-radio-label{
    font-family:var(--lb);font-size:9px;letter-spacing:2px;
    color:#9A9A98;text-transform:uppercase;
  }

  /* Magazine content wrapper */
  #root{padding-bottom:20px;background:#F5F2EB;}

  /* Radio player top right */
  #radio-player{
    position:fixed;top:14px;right:16px;
    background:rgba(0,0,0,.82);backdrop-filter:blur(14px);

/* ═══ SPLASH INTRO ═══ */
#splash{
  position:fixed;inset:0;z-index:99999;
  background:#000000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .7s ease,visibility .7s ease;
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none;}
#splash-logo-wrap{
  position:relative;overflow:hidden;
  opacity:0;transform:scale(.92);
  animation:splashIn 1s cubic-bezier(.19,1,.22,1) forwards;
}
#splash-logo{
  height:clamp(90px,16vw,160px);width:auto;display:block;
  position:relative;z-index:1;
}
#splash-shimmer{
  position:absolute;top:0;left:-150%;width:80%;height:100%;
  background:linear-gradient(100deg,transparent 20%,rgba(212,168,83,.55) 45%,rgba(255,235,190,.85) 50%,rgba(212,168,83,.55) 55%,transparent 80%);
  z-index:2;
  animation:splashShimmer 1.6s ease-in-out .5s 1;
  mix-blend-mode:screen;
}
#splash-tag{
  font-family:var(--lb);font-size:9px;letter-spacing:6px;
  color:rgba(212,168,83,.75);text-transform:uppercase;
  margin-top:18px;opacity:0;
  animation:splashTagIn .8s ease forwards .9s;
}
#splash-rule{
  width:0;height:1px;background:#B87A45;margin-top:14px;
  animation:splashRule .6s ease forwards 1.1s;
}
@keyframes splashIn{
  from{opacity:0;transform:scale(.92);}
  to{opacity:1;transform:scale(1);}
}
@keyframes splashShimmer{
  0%{left:-150%;}
  100%{left:150%;}
}
@keyframes splashTagIn{
  from{opacity:0;transform:translateY(6px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes splashRule{
  from{width:0;}
  to{width:140px;}
}
@media(max-width:600px){
  #splash-tag{font-size:7px;letter-spacing:4px;}
  #splash-rule{width:0;}
  @keyframes splashRule{from{width:0;}to{width:90px;}}
}

function setupReveal(){

  var obs=new IntersectionObserver(function(en){en.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');obs.unobserve(e.target);}});},{threshold:0.15});
  els.forEach(function(e){obs.observe(e);});
}

  function para(t,cls){var d=h('div',{className:cls||'fade s1',style:{fontFamily:"var(--lb)",fontSize:'16px',lineHeight:2,color:'rgba(244,240,230,.85)',marginBottom:'26px'}});d.textContent=t;return d;}
  // Drop cap opener
  var opener=h('div',{className:'fade',style:{marginBottom:'26px'}});
  var dc=h('div',{});
  var drop=h('span',{style:{float:'left',fontFamily:"var(--pf)",fontSize:'92px',fontWeight:400,lineHeight:.82,marginRight:'12px',marginTop:'10px',color:'#F5F2EB'}},'\u2018');
  var rest=h('span',{style:{fontFamily:"var(--lb)",fontSize:'16px',lineHeight:2,color:'rgba(244,240,230,.85)'}});
  rest.textContent='here is a moment — most of us have had it — where everything around you is loud, uncertain, and moving too fast. The world shifts, people change, circumstances change, and somehow in the middle of all of it, music is just there. Steady. Unchanged. Waiting.';
  dc.appendChild(drop);dc.appendChild(rest);opener.appendChild(dc);inner.appendChild(opener);
  inner.appendChild(para('I was seven years old the first time I understood that. My parents had records, cassette tapes, CDs — a whole collection that told me the world had been feeling something long before I arrived in it. Family members who lived inside the music. A culture that held people before the world ever got around to noticing them. That was my first education. Not a classroom. A record collection.','fade s2'));
  inner.appendChild(para('What I learned growing up is that culture — real culture — does not ask for your credentials before it lets you in. It does not check your follower count or your deal status or who you know. It just holds you. It sees you. And after all the noise of the world trying to tell you who matters and who does not, culture is what is left standing. Afternoise was built for that space. The space after the noise.','fade s3'));
  inner.appendChild(para('We live in a time where visibility is currency and attention is manufactured. Where the loudest voice in the room is often the one with the least to say. Where people who did not build anything are celebrated for borrowing what others created. Culture vultures — the ones who arrive after the work is done, take what was never theirs, and move on before the bill comes due. They are everywhere. And they take up space that belongs to someone else. This magazine is not for them.','fade s4'));
  inner.appendChild(para('Afternoise is for the ones who were already in it before anyone was watching. The artist who is also the A&R, the manager, the connector — the one losing sleep not for themselves but to make sure the people around them get seen. The DJ who took the gig nobody else wanted and turned it into a moment nobody will forget. The producer in the studio building the sound before the artist even knows what they need. The designer working through the night on a vision that only they can see yet. Vol. I is called Origins because everything in this issue starts at the beginning. Before the recognition. Before the numbers. Before the world caught up. No matter what you do, no matter how big or small the room you are doing it in — if the work is real, this magazine will find you. We will make you feel like the cover because to us, you already are.','fade s5'));
  // Pull quote
  var pq=h('div',{className:'fade s5',style:{borderLeft:'3px solid #B87A45',paddingLeft:'24px',margin:'36px 0'}});
  var pqt=h('div',{style:{fontFamily:"var(--pf)",fontStyle:'normal',fontSize:'28px',lineHeight:1.0,color:'#F5F2EB',letterSpacing:'1px',marginBottom:'8px'}});
  pqt.textContent='"After the noise, what remains is the truth of who was really there."';
  pq.appendChild(pqt);inner.appendChild(pq);
  // Sign off
  var so=h('div',{className:'fade s6',style:{marginTop:'44px',paddingTop:'32px',borderTop:'.5px solid rgba(255,255,255,.1)'}});
  so.appendChild(h('div',{style:{fontFamily:"var(--pf)",fontStyle:'italic',fontSize:'22px',color:'#B87A45',marginBottom:'4px'}},'Craig Allen'));
  so.appendChild(h('div',{style:{fontFamily:"var(--lb)",fontSize:'10px',letterSpacing:'3px',color:'rgba(244,240,230,.4)',textTransform:'uppercase',marginBottom:'4px'}},'Founder & Creative Director, Afternoise'));
  so.appendChild(h('div',{style:{fontFamily:"var(--lb)",fontSize:'10px',letterSpacing:'2px',color:'rgba(244,240,230,.3)',textTransform:'uppercase'}},'Toronto, ON \u00b7 Aug 2026'));
  inner.appendChild(so);

  var rb=h('button',{className:'btn-g',style:{fontSize:'10px',letterSpacing:'3px'}},'Read Vol. I \u2192');rb.onclick=function(){go('radar');};cta.appendChild(rb);

}

      "The cultural math on that is worth sitting with. The same man who started his morning in the presence of a SWAT team closed it by winning a Verzuz battle 19-3 in front of the internet. Whatever your position on YG, whatever the investigation ultimately finds, that is a level of composure that deserves to be acknowledged.",
      "The Game\u2019s 2005 debut The Documentary helped revive a post-2Pac West Coast and opened the door for a new generation that includes YG, whose 2014 album My Krazy Life became a defining project of the 2010s. That generational gap is what made Compton Forever compelling before a single record was played. Two eras of the same city. Two different blueprints for what West Coast rap could be. The Game with Dre behind him, the classics: Hate It or Love It, How We Do, Westside Story. YG with DJ Mustard\u2019s 808s underneath him, the street energy translated into something radio-ready without sacrificing anything.",
      "The Game also turned the evening into a spectacle of its own, downing nearly an entire bottle of Don Julio tequila in a single gulp and dropping the empty bottle to the ground in celebration. That moment, combined with YG\u2019s morning, gave Compton Forever a narrative that no one could have scripted. The battle is now streaming on Apple Music. The conversation it started has not stopped.",
      "West Coast supremacy was on the line. YG took it. The morning he had before walking on that stage made it mean something more."
    ]
  },
  'rb-summer-2026':{
    cat:'R&B',catColor:'#416356',
    headline:"The R&B Summer of 2026 Has No Ceiling",
    byline:'By Afternoise Editorial',date:'July 2026',
    body:[
      "From Drake\u2019s Iceman to Kehlani\u2019s self-titled project to Don Toliver\u2019s OCTANE, 2026 has been a great year for music broadly. But within that crowded landscape, the R&B conversation has been the most consistently rewarding.",
      "Start with Isaiah Rashad. IT\u2019S BEEN AWFUL, released May 1st through TDE and Warner Records, is his first full-length project in five years \u2014 a 16-track, 54-minute album featuring SZA on the deceptively peppy BOY IN RED and Dominic Fike lending melodic support on the ethereal CAMERAS. The album is deeply personal \u2014 about rehab stints, family ties, the cost of the highs and the weight of the comedowns. It received universal acclaim on Metacritic. Five years between projects, and Rashad came back with arguably the most honest work of his career.",
      "Then there is Brent Faiyaz. Icon, released February 13th, leans into his songwriting strengths \u2014 each track diving deeper into the ebbs and flows of fast-paced love. Faiyaz has always understood that R&B at its best is not about volume or spectacle. It is about precision. Every note placed where it will do the most damage. Icon proves that thesis across an entire album without a single wasted moment.",
      "Kehlani\u2019s self-titled album. Jordan Ward\u2019s Backward. Elmiene\u2019s sounds for someone. Rising names like Samara Cyn are quietly building catalogs the culture will be talking about for years. What makes this R&B moment different from prior summers is the diversity of approach. Nobody is doing the same thing. Rashad is confessional and chaotic. Faiyaz is precise and cool. Kehlani is emotionally direct. Elmiene is stretching the genre toward something that does not have a clean name yet.",
      "None of them sound like each other. All of them are worth your full attention. The summer is not done. Pay attention."
    ]
  },
  'sneakers-2026':{
    cat:'Style',catColor:'#B87A45',
    headline:"The Sneaker Game in 2026 Has No Wrong Answer",
    byline:'By Afternoise Editorial',date:'July 2026',
    body:[
      "The sneaker market hit $131 billion globally in 2025. That number keeps growing. And the reason it keeps growing is the same reason it exploded in the first place \u2014 the culture decided that footwear was not an accessory. It was a statement. That decision was made in the streets, in barbershops, on courts and corners, long before any analyst put a dollar figure on it.",
      "In 2026, the conversation is more interesting than ever because the field is more wide open than it has ever been. Bad Bunny built a new silhouette from scratch with adidas and called it the BadBo 1.0. Pharrell continues to make adidas do things nobody thought were possible. Jordan Brand brought back the Air Jordan 7 Dream Team colorway in time for the FIFA World Cup, deploying nostalgia at exactly the right moment. Kobe Protros are back in rotation. The Air Jordan 11 got its first women\u2019s collab in history through Jaide and The Whitaker Group.",
      "But the real story of 2026 sneakers is what is happening outside of Nike and Jordan. New Balance has been on a run that feels generational \u2014 the 1906R, the 990v6, the collaborations with Aimé Leon Dore that keep setting a standard for what a lifestyle sneaker can be. ASICS and On Running are sitting at the same table as the giants now, serving customers who care more about fit, feel, and design than they do about the logo on the heel.",
      "The days when one brand dictated the entire conversation are behind us. The market is bigger, the consumer is more informed, and the options are better than they have ever been. Wear what moves you. That has always been the rule. In 2026, the options have never been more worth choosing from."
    ]
  },
  'quiet-streetwear':{
    cat:'Streetwear',catColor:'#5957FF',
    headline:"Quiet Is the New Loud in Streetwear",
    byline:'By Afternoise Editorial',date:'July 2026',
    body:[
      "There was a moment in streetwear \u2014 you felt it if you were paying attention \u2014 when the logo became the whole outfit. You wore the brand name the way you would wear a credential. The bigger the font, the more you spent, the louder the signal. For a while that worked. Then it stopped working.",
      "Streetwear in 2026 is moving toward something more considered. Clean silhouettes. Monochrome fits. Structured oversized cuts that look intentional rather than accidental. The pieces that are moving right now are built around quality and versatility \u2014 things that work at a cookout, a gallery opening, and a late-night set without requiring you to change. The fit does the talking. The logo, if it is there at all, is secondary.",
      "This shift did not come from fashion weeks or trend forecasters. It came from the same place every real style movement comes from \u2014 the people who were overdressed for casual situations and underdressed for formal ones decided to solve both problems with one wardrobe. The culture figured out what fashion took decades to learn: if the fit is right, you do not need a logo to announce yourself.",
      "The brands winning in this space right now understand the assignment. Fear of God Essentials. Represent. A-Cold-Wall. ERD. Stone Island in a quieter configuration. Pieces designed to last, built to layer, priced to justify. The streetwear era is not over. It has just grown up."
    ]
  },
  'chavarria-adidas':{
    cat:'Fashion',catColor:'#416356',
    headline:"Adidas x Willy Chavarria Is the Most Interesting Collab of the Year",
    byline:'By Afternoise Editorial',date:'July 2026',
    body:[
      "Fashion collaborations fail when the brand and the designer want different things. The brand wants product that moves. The designer wants creative control. When those two things cannot coexist, you get something that looks like a collab but operates like a transaction. The adidas x Willy Chavarria collaboration for the FIFA World Cup 2026 avoided that failure entirely.",
      "Willy Chavarria designing for the Mexican national team during the biggest sporting event on American soil is the kind of intersection that fashion rarely gets right. The adidas x Chavarria Megaride \u2014 sculptural midsole, open air tunnels, deep black upper with cream details \u2014 is not a football shoe trying to be a lifestyle sneaker. It is a design statement that happens to come with a World Cup context. There is a difference, and Chavarria understood it.",
      "Chavarria has been one of the most culturally aware designers working today. His runway work at Valentino brought a perspective rooted in Chicano culture and American working-class identity into one of the most elite spaces in fashion. That background does not disappear when he works with adidas. It informs every decision, including the decision about what this shoe is not \u2014 it is not a limited-release hype object designed to flip. It is a piece designed to be worn and understood.",
      "The best fashion happens when the creative brief is bigger than just selling product. This collab had a brief worth designing for \u2014 the World Cup, the Mexican national team, the diaspora watching from cities across North America. Chavarria answered that brief. The result is the most interesting collab of 2026 and it is not particularly close."
    ]
  },
  'iran-us-tension':{
    cat:'World',catColor:'#B87A45',
    headline:"Iran and the U.S. Are Back on the Brink",
    byline:'By Afternoise Editorial',date:'July 29, 2026',
    body:[
      "The ceasefire didn\u2019t hold. Iran launched a surprise ballistic missile attack on U.S. forces stationed in Jordan this week, marking a serious escalation after nearly two weeks of paused airstrikes and quiet diplomatic efforts to walk the conflict back. U.S. defense officials say the missiles were intercepted before impact. Hours later, U.S. and Saudi fighter jets struck targets in Iraq tied to Iran-backed forces, responding to a string of more than 30 drone attacks over the previous three days.",
      "The escalation marks a shift in how Iran has approached this conflict. Until now, Tehran had generally fired on U.S. forces in direct retaliation for U.S. airstrikes on Iranian territory. This attack signals a broader willingness to expand the fight regardless of what happens on Iranian soil directly.",
      "The economic ripple was immediate. A satellite image released this week showed smoke rising from the Saudi Aramco oil processing facility in Abqaiq \u2014 one of the most consequential energy sites on the planet \u2014 after it came under fire. Markets have been reacting to every development since. This is a five-month conflict that has already reshaped global oil prices and travel corridors, and this week made clear it is far from resolved.",
      "What happens next depends on diplomatic meetings happening in real time, including separate talks between U.S. leadership and both Ukrainian and Israeli officials. Both sides are facing pressure at home to show restraint, and both sides have shown they are willing to escalate first and explain later. That combination is exactly what makes this moment as dangerous as any point since the conflict began."
    ]
  },
  'lebron-sixers':{
    cat:'Sports',catColor:'#5957FF',
    headline:"LeBron Left the Lakers. The Sixers Are Getting Him for $8 Million.",
    byline:'By Afternoise Editorial',date:'July 24, 2026',
    body:[
      "Eight years in purple and gold ended this month, and the King\u2019s next chapter is happening in Philadelphia. LeBron James signed a two-year, $8 million deal with the 76ers, entering a record-extending 24th NBA season at 41 years old \u2014 his fourth team, chasing his fifth championship. He turned down bigger money elsewhere to do it. When you are the all-time leading scorer in NBA history, apparently the decision was never really about the number on the check.",
      "The Lakers put out a gracious statement. Jeanie Buss called him a cherished part of the family and pointed back to the 2020 title he delivered under bubble conditions nobody wants to relive. LeBron\u2019s response on X hit different \u2014 \u201cNo, THANK YOU. Truly an honor to wear the purple and gold.\u201d Real ones know that kind of exit doesn\u2019t happen often in this league. Most farewells are messier than that.",
      "The subplot everyone wanted was Bronny joining him in Philly. That is not happening. The Sixers\u2019 roster is tight and LeBron didn\u2019t take a discount big enough to force it. Rich Paul made the read that mattered most: going back to Miami or Cleveland risks disturbing memories that were better left where they were. Philadelphia is a clean slate at 41.",
      "James was honest about how close this was to being the end entirely. \u201cI thought I was done when the season ended,\u201d he posted. \u201cI wasn\u2019t ready to announce it, and I knew I needed some time to really decide, but I was pretty sure I played my last game.\u201d The fact that he is still here, still choosing a new team over retirement, says something about how LeBron is approaching the tail end of a career nobody else has ever had. This was framed as his last decision. Nobody who has followed this career is fully ready to believe that yet."
    ]
  },
  'gopro-gp3':{
    cat:'Tech',catColor:'#D9C8AE',
    headline:"GoPro's New GP3 Cameras Are Built for Creators Who Demand More",
    byline:'By Afternoise Editorial',date:'July 2026',
    body:[
      "GoPro just gave content creators a real reason to upgrade. The new GP3 processor-powered camera lineup, unveiled this year at the NAB Show, is being called one of the most significant product launches in the company\u2019s history \u2014 better low-light performance, higher resolution, faster frame rates, and cleaner thermal handling across the board. This is not an incremental spec bump. It is GoPro building specifically for the professional tier of creators who have outgrown consumer gear.",
      "The timing matters. 2026\u2019s content landscape is oversaturated with AI-generated everything, and audiences are actively pulling back toward raw, human-shot footage that feels real. People have had enough of awkward AI videos. They want real, unpredictable experiences \u2014 in short, they want to actually feel something. GoPro leaning into image quality and low-light capability right now is a bet that the creators who invest in better gear are the ones who are going to separate themselves from a feed full of synthetic content.",
      "GoPro has already proven it belongs in serious productions \u2014 its cameras have shown up in major Hollywood features for years because of exactly this kind of durability and mount-anywhere versatility. The GP3 push extends that reputation into a new generation of gear built for creators who need something fast, flexible, and easy to live with day to day, whether that is a vlog, a social-first channel, or full production work.",
      "For anyone building a real channel, a real archive, real behind-the-scenes footage of a tour, a set, a carnival truck \u2014 this is the upgrade to watch. The gear conversation in 2026 is not about who has the most filters. It is about who can capture something nobody else was in position to catch."
    ]
  },
  'spiderman-brand-new-day':{
    cat:'Film',catColor:'#416356',
    headline:"Spider-Man: Brand New Day Is Proof Superhero Fatigue Was Never Real",
    byline:'By Afternoise Editorial',date:'July 28, 2026',
    body:[
      "Everyone kept saying the genre was dying. Tom Holland\u2019s fourth outing as Spider-Man just walked into theaters and made that conversation look premature. Brand New Day is tracking toward one of the biggest opening weekends the character has ever had, arriving four years after the world forgot Peter Parker existed \u2014 the fallout from No Way Home finally getting its real reckoning.",
      "Director Destin Daniel Cretton does not waste the setup. Peter is still doing the work with no one around to thank him for it, which gives this film a loneliness the earlier trilogy never had room for. When a new threat forces him into an uneasy alliance with allies he does not fully trust, the movie leans into something Spider-Man stories rarely sit with long enough \u2014 what happens to your sense of self when literally nobody remembers who you used to be.",
      "The pull quote making the rounds is blunt and accurate: superhero fatigue is real, Spider-Man fatigue is not. That distinction is worth paying attention to. It is not that audiences are tired of capes. They are tired of movies that do not earn the spectacle.",
      "Brand New Day earns it, and the box office is already saying so \u2014 The Odyssey just crossed $700 million globally in the same summer, proof that when a film actually delivers, audiences still show up in force. Superhero fatigue was never really about the genre. It was about the execution. Sony and Marvel clearly got the memo this time."
    ]
  }

function render(){
  cancelAnimationFrame(TRaf);window.onscroll=null;
  // Show masthead only on TOC/stories page
  var mast=document.querySelector('.outer-masthead');
  if(mast){
    if(ST.page==='toc'){
      mast.style.display='';
    } else {
      mast.style.display='none';
    }
  }
  // Active nav state
  var navMap={'toc':'#toc','radar':'#radar','radio':'#radio','archive':'#archive'};
  document.querySelectorAll('.outer-nav-item').forEach(function(a){
    var pg=a.getAttribute('href')?a.getAttribute('href').replace('#',''):'';
    if(pg===ST.page||(ST.page==='article'&&pg==='toc')||(ST.page==='radar-yanna'&&pg==='radar')||(ST.page==='radar-donfresh'&&pg==='radar')){
      a.style.color='#B87A45';
    } else {
      a.style.color='';
    }
  });
  var root=document.getElementById('root');root.innerHTML='';
  var pw=h('div',{id:'page-wrap',style:{opacity:0,transform:'translateY(10px)'}});
  if(ST.page==='toc')pw.appendChild(buildTOC());
  if(ST.page==='article')pw.appendChild(buildArt(ST.idx));
  if(ST.page==='about')pw.appendChild(buildAbout());
  if(ST.page==='letter')pw.appendChild(buildLetter());
  if(ST.page==='playlist')pw.appendChild(buildPlaylist());
  if(ST.page==='radio')pw.appendChild(buildRadioPage());
  if(ST.page==='noise')pw.appendChild(buildNoisePage());
  if(ST.page==='noise-art')pw.appendChild(buildNoiseArt(NOISE_ARTS[ST.idx]));
  if(ST.page==='radar')pw.appendChild(buildRadar());
  if(ST.page==='radar-yanna')pw.appendChild(buildRadarYanna());
  if(ST.page==='radar-donfresh')pw.appendChild(buildRadarDonFresh());
  if(ST.page==='essay')pw.appendChild(buildEssay());
  if(ST.page==='archive')pw.appendChild(buildArchive());
  if(ST.page==='spintheblock')pw.appendChild(buildSpinTheBlock());
  root.appendChild(pw);
  setTimeout(function(){
    pw.style.transition='opacity .45s ease,transform .45s ease';pw.style.opacity='1';pw.style.transform='translateY(0)';
    pw.querySelectorAll('.fade').forEach(function(f){setTimeout(function(){f.classList.add('in');},60);});
    setupReveal();
    var bt=document.getElementById('toTop');if(bt)bt.onclick=function(){window.scrollTo({top:0,behavior:'smooth'});};
  },40);
  runTick();
  // Show bottom nav on all interior pages except cover
  var magNav=document.getElementById('mag-nav');
  if(magNav){
    magNav.classList.add('show');
    // Set active state
    ['stories','letter','playlist','stb','more'].forEach(function(id){
      var btn=document.getElementById('mnav-'+id);
      if(btn)btn.classList.remove('active');
    });
    var activeMap={'toc':'stories','letter':'letter','playlist':'playlist','spintheblock':'stb','archive':'more','about':'more','essay':'more','radar':'more','article':'stories'};
    var activeId=activeMap[ST.page]||'stories';
    var activeBtn=document.getElementById('mnav-'+activeId);
    if(activeBtn)activeBtn.classList.add('active');
  }
}

// Nav scroll fade — hide gradient when scrolled to end
(function(){
  var nav = document.getElementById('outer-nav-inner');
  var fade = document.getElementById('nav-fade');
  if(!nav || !fade) return;
  function updateFade(){
    var atEnd = nav.scrollLeft + nav.clientWidth >= nav.scrollWidth - 8;
    fade.style.opacity = atEnd ? '0' : '1';
    fade.style.transition = 'opacity .3s';
  }
  nav.addEventListener('scroll', updateFade, {passive:true});
  window.addEventListener('resize', updateFade);
  // Initial check after fonts load
  setTimeout(updateFade, 500);
})();

// Nav scroll hint — hide after user scrolls
(function(){
  var nav = document.getElementById('outer-nav-inner');
  var outerNav = document.querySelector('.outer-nav');
  if(!nav || !outerNav) return;
  function checkScroll(){
    if(nav.scrollLeft > 10){
      outerNav.classList.add('scrolled');
    }
  }
  nav.addEventListener('scroll', checkScroll, {passive:true});
  // Also hide after 3 seconds automatically on mobile
  if(window.innerWidth <= 768){
    setTimeout(function(){
      outerNav.classList.add('scrolled');
    }, 3000);
  }
})();

// Nav scroll hint — only show if nav actually overflows
(function(){
  var hint = document.getElementById('nav-scroll-hint');
  var nav  = document.getElementById('outer-nav-inner');
  var navWrap = document.getElementById('outer-nav');
  if(!hint || !nav || !navWrap) return;

  function checkOverflow(){
    // Only show hint if nav content is wider than the nav container
    var overflows = nav.scrollWidth > navWrap.clientWidth + 10;
    if(overflows && window.innerWidth <= 768){
      hint.style.display = 'flex';
      hint.style.opacity = '1';
    } else {
      hint.style.display = 'none';
    }
  }

  // Hide hint once user scrolls
  nav.addEventListener('scroll', function(){
    hint.style.opacity = '0';
    setTimeout(function(){ hint.style.display = 'none'; }, 400);
  }, {once:true});

  // Check on load and resize
  setTimeout(checkOverflow, 300);
  window.addEventListener('resize', checkOverflow);
})();

// Radio toggle
var _playing = false;
var _rpInterval;
function togglePlay(){
  var audio = document.getElementById('radio-audio');
  var btn = document.getElementById('radio-play-btn');
  var song = document.getElementById('radio-song');
  if(!_playing){
    audio.play();
    _playing = true;
    btn.innerHTML = '&#9646;&#9646;';
    fetchSong();
    _rpInterval = setInterval(fetchSong, 30000);
  } else {
    audio.pause(); audio.currentTime=0;
    _playing = false;
    btn.innerHTML = '&#9654;';
    clearInterval(_rpInterval);
    song.textContent = 'Afternoise Radio';
  }
}
function fetchSong(){
  fetch('https://api.live365.com/station/a82938')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.song){
        var t = (d.song.artist_name ? d.song.artist_name + ' — ' : '') + (d.song.title||'');
        if(t) document.getElementById('radio-song').textContent = t;
      }
    }).catch(function(){});
}
